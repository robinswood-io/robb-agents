<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1f24">
  <meta name="referrer" content="no-referrer">
  <title>Robb Agents — Hors ligne</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow-x: clip; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
      background: radial-gradient(circle at 50% 12%, rgba(126, 87, 194, .16), transparent 38%), #f8f8fa;
      color: #20202a;
    }
    main { width: min(100%, 420px); text-align: center; }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(109, 93, 252, .2);
      border-radius: 24px;
      color: #6d5dfc;
      background: rgba(109, 93, 252, .1);
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 7vw, 2rem); line-height: 1.15; letter-spacing: -.025em; }
    p { margin: 14px auto 0; max-width: 36ch; color: #6f6f7a; font-size: .95rem; line-height: 1.65; }
    .privacy { margin-top: 20px; padding: 12px 14px; border-radius: 14px; background: rgba(109, 93, 252, .07); font-size: .8rem; line-height: 1.5; }
    button {
      min-width: 160px;
      min-height: 48px;
      margin-top: 24px;
      padding: 0 20px;
      border: 0;
      border-radius: 14px;
      background: #6d5dfc;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(109, 93, 252, .25);
    }
    button:focus-visible { outline: 3px solid rgba(109, 93, 252, .3); outline-offset: 3px; }
    #status { min-height: 1.5em; margin-top: 12px; font-size: .78rem; }
    @media (prefers-color-scheme: dark) {
      body { background: radial-gradient(circle at 50% 12%, rgba(155, 123, 184, .2), transparent 38%), #111116; color: #f2f2f6; }
      p { color: #a9a9b3; }
      .privacy { background: rgba(155, 123, 184, .1); }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/><path d="m3 3 18 18"/></svg>
    </div>
    <h1 id="title">Vous êtes hors ligne</h1>
    <p id="description">L’interface est disponible, mais votre hôte Robb doit être joignable pour consulter les sessions et piloter les agents.</p>
    <p class="privacy" id="privacy">Par sécurité, aucune conversation, pièce jointe ni donnée d’authentification n’est enregistrée dans le cache hors ligne.</p>
    <button id="retry" type="button">Réessayer</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const isFrench = (navigator.language || '').toLowerCase().startsWith('fr');
    if (!isFrench) {
      document.documentElement.lang = 'en';
      document.title = 'Robb Agents — Offline';
      document.getElementById('title').textContent = 'You are offline';
      document.getElementById('description').textContent = 'The interface is available, but your Robb host must be reachable to view sessions and control agents.';
      document.getElementById('privacy').textContent = 'For security, no conversation, attachment, or authentication data is stored in the offline cache.';
      document.getElementById('retry').textContent = 'Try again';
    }
    const retry = () => {
      document.getElementById('status').textContent = isFrench ? 'Reconnexion…' : 'Reconnecting…';
      window.location.reload();
    };
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry, { once: true });
  </script>
</body>
</html>
