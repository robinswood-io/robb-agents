appId: io.robinswood.robbagents
productName: Robb Agents
copyright: Copyright © 2026 Robinswood

electronVersion: "39.2.7"

# Hook to compile macOS 26+ Liquid Glass icon after packaging
afterPack: scripts/afterPack.cjs

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  # Build outputs and local launcher bundles may contain complete macOS apps.
  # They must never be nested into a new package: framework-relative symlinks
  # in those apps are invalid when electron-builder copies them as payload.
  - "!release"
  - "!release/**"
  - "!release-dev"
  - "!release-dev/**"
  - "!.robb-dev-runtime"
  - "!.robb-dev-runtime/**"
  - "!dev-runtime"
  - "!dev-runtime/**"
  # The macOS dev launcher materializes `dist/Robb Agents.app`. It is a
  # runnable Electron bundle, not application payload, and must never be
  # nested inside a distributable app (its framework symlinks break packaging).
  # Exclude the legacy dev app too: it may still exist locally from releases
  # before the launcher moved to `dev-runtime/`.
  - "!dist/Robb Agents.app"
  - "!dist/Robb Agents.app/**"
  - "!dist/**/*.app"
  - "!dist/**/*.app/**"
  - "!dist/renderer/src/**"
  - "!**/*.map"
  - package.json
  # Include bundled MCP servers (bridge + session) for Codex sessions
  - resources/bridge-mcp-server/**/*
  - resources/session-mcp-server/**/*
  # Include Pi agent server subprocess for Pi SDK sessions
  - resources/pi-agent-server/**/*
  # Note: Bundled assets (docs, themes, permissions, tool-icons) are in resources/
  # and copied to dist/resources/ by build:copy. They're included via dist/**/* above.
  # Include network interceptor for API error capture and MCP schema injection
  - packages/shared/src/unified-network-interceptor.ts
  - packages/shared/src/interceptor-common.ts
  - packages/shared/src/feature-flags.ts
  - packages/shared/src/interceptor-request-utils.ts
  # Include CLI tool Python scripts (platform-independent)
  - resources/scripts/**/*
  # Include CLI tool shell wrappers (platform-independent, both Unix and Windows)
  - resources/bin/markitdown
  - resources/bin/markitdown.cmd
  - resources/bin/pdf-tool
  - resources/bin/pdf-tool.cmd
  - resources/bin/xlsx-tool
  - resources/bin/xlsx-tool.cmd
  - resources/bin/doc-diff
  - resources/bin/doc-diff.cmd
  - resources/bin/img-tool
  - resources/bin/img-tool.cmd
  - resources/bin/docx-tool
  - resources/bin/docx-tool.cmd
  - resources/bin/pptx-tool
  - resources/bin/pptx-tool.cmd
  - resources/bin/ical-tool
  - resources/bin/ical-tool.cmd
  # Platform-native uv and Bun binaries are copied through each platform's
  # extraResources block. Keeping them out of the generic file collector
  # prevents Windows executable locks and guarantees one target architecture.
  # Exclude everything from node_modules (will use extraResources for SDK)
  - "!node_modules/**/*"

# Since SDK 0.2.113 the SDK ships a thin core (`@anthropic-ai/claude-agent-sdk`)
# and a per-platform optional dependency (`-darwin-arm64`, `-darwin-x64`, etc.)
# containing the ~210 MB native `claude` binary. We bundle both as extraResources
# below — only the binary matching the build target is shipped per artifact, so
# the platform `files` rules below also exclude the wrong-platform binaries.
#
# Why extraResources instead of `files`: since electron-builder v20.15.2,
# `node_modules` directories are auto-excluded from `files`. extraResources
# bypasses that. See: https://github.com/electron-userland/electron-builder/issues/3104
#
# Ripgrep is sourced from `@vscode/ripgrep` (was previously bundled inside the
# SDK as `vendor/ripgrep/<platform>/rg`; removed in 0.2.113).

extraMetadata:
  main: dist/main.cjs

# Stable production updates are published as signed public GitHub Releases.
# The application never checks or downloads automatically: the Settings button
# is the sole update entry point.
publish:
  provider: github
  owner: robinswood-io
  repo: robb-agents
  channel: latest
  releaseType: release
  publishAutoUpdate: true

# Disable ASAR to avoid decompression overhead and click delays
asar: false

mac:
  category: public.app-category.productivity
  icon: resources/robinswood-icon.icns
  # macOS 26+ Liquid Glass: Tell macOS to look for icon in Assets.car
  # The value must match --app-icon used in actool (see afterPack.cjs)
  extendInfo:
    CFBundleIconName: AppIcon
    # Required for macOS to list the app under Privacy & Security > Local Network
    # and prompt for permission. Without it the app is silently denied LAN access
    # and never appears in the privacy pane (craft-agents-oss#938).
    NSLocalNetworkUsageDescription: "Robb Agents uses your local network to reach LAN addresses and devices you ask an agent to access, such as local servers or APIs."
  target:
    - dmg
    - zip
  # `notarize: true` is activated only when standard Apple credentials are
  # supplied by the release operator/CI; local developer builds remain usable.
  notarize: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    # Thin core SDK (sdk.mjs + types). ~4 MB — present on every platform.
    - from: node_modules/@anthropic-ai/claude-agent-sdk
      to: app/node_modules/@anthropic-ai/claude-agent-sdk
    # Stable alias pointing at the target-arch native binary package.
    # Populated by build-dmg.sh / build-linux.sh / build-win.ps1 before
    # electron-builder runs (`apps/electron/node_modules/@anthropic-ai/claude-agent-sdk-binary/`).
    # The runtime resolver (runtime-resolver.ts) looks here first.
    - from: node_modules/@anthropic-ai/claude-agent-sdk-binary
      to: app/node_modules/@anthropic-ai/claude-agent-sdk-binary
    # ripgrep (used by packages/server-core/src/services/search.ts).
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    # Bun and uv are read below process.resourcesPath/app at runtime.
    - from: vendor/bun
      to: app/vendor/bun
    - from: resources/bin/${platform}-${arch}
      to: app/resources/bin/${platform}-${arch}
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs
  # Use predictable naming for macOS packages (applies to zip; dmg uses its own config below)
  artifactName: "Robb-Agents-${arch}.${ext}"
  # Supply CSC_LINK/CSC_KEY_PASSWORD (or CSC_NAME) and standard Apple
  # notarization credentials only in the release environment. No account,
  # certificate, endpoint or update server is embedded in this OSS project.

dmg:
  # Use predictable naming: Robb-Agents-arm64.dmg, Robb-Agents-x64.dmg
  artifactName: "Robb-Agents-${arch}.dmg"
  # Custom background (multi-resolution TIFF with 1x+2x for retina support)
  background: resources/dmg-background.tiff
  # Use app icon as the mounted volume icon in Finder
  icon: resources/robinswood-icon.icns
  iconSize: 80
  title: "Robb Agents"
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  icon: resources/robinswood-icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Use predictable naming: Robb-Agents-x64.exe
  artifactName: "Robb-Agents-${arch}.${ext}"
  # Copy executables as extraResources to avoid EBUSY file locking (see comment above)
  extraResources:
    - from: node_modules/@anthropic-ai/claude-agent-sdk
      to: app/node_modules/@anthropic-ai/claude-agent-sdk
    - from: node_modules/@anthropic-ai/claude-agent-sdk-binary
      to: app/node_modules/@anthropic-ai/claude-agent-sdk-binary
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    - from: vendor/bun/bun.exe
      to: app/vendor/bun/bun.exe
    - from: resources/bin/win32-x64
      to: app/resources/bin/win32-x64
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs

nsis:
  # Per-user installation avoids elevation and keeps Bun/Pi subprocess files
  # writable. The assisted flow makes the install location and uninstall
  # behavior visible to the user rather than silently changing their machine.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Robb Agents
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  displayLanguageSelector: true
  multiLanguageInstaller: true

linux:
  # Do not inherit the monorepo workspace package name (@craft-agent/electron):
  # AppImage requires a filesystem-safe executable name.
  executableName: robb-agents
  # Keep the desktop filename and StartupWMClass aligned with package.json's
  # desktopName instead of the monorepo workspace package name.
  syncDesktopName: true
  icon: resources/robinswood-icon.png
  category: Utility
  maintainer: "Robb Agents Contributors"
  target:
    - AppImage
  artifactName: "Robb-Agents-${arch}.${ext}"
  extraResources:
    - from: node_modules/@anthropic-ai/claude-agent-sdk
      to: app/node_modules/@anthropic-ai/claude-agent-sdk
    - from: node_modules/@anthropic-ai/claude-agent-sdk-binary
      to: app/node_modules/@anthropic-ai/claude-agent-sdk-binary
    - from: node_modules/@vscode/ripgrep
      to: app/node_modules/@vscode/ripgrep
    - from: vendor/bun
      to: app/vendor/bun
    - from: resources/bin/${platform}-${arch}
      to: app/resources/bin/${platform}-${arch}
    # WhatsApp worker subprocess (self-contained; Baileys bundled in).
    - from: ../../packages/messaging-whatsapp-worker/dist/worker.cjs
      to: messaging-whatsapp-worker/worker.cjs
