name: Upstream review watch

on:
  schedule:
    - cron: "30 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Report upstream changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Fetch upstream main without changing Robb history
        run: |
          set -euo pipefail
          git remote add craft-upstream https://github.com/craft-ai-agents/craft-agents-oss.git
          git fetch --no-tags --depth=200 craft-upstream main
          git update-ref refs/remotes/upstream/main FETCH_HEAD
      - name: Generate non-mutating review report
        run: |
          python3 scripts/robinswood_upstream_watch.py \
            --baseline docs/robinswood/upstream-watch-baseline.json \
            --upstream-ref upstream/main \
            --output upstream-watch-report.md
          cat upstream-watch-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-watch-report
          retention-days: 30
          path: upstream-watch-report.md
