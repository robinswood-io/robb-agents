name: Robinswood Validate

on:
  pull_request:
    branches:
      - robinswood/main
  push:
    branches:
      - robinswood/main
  workflow_dispatch:

concurrency:
  group: robinswood-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Robb OSS validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan checked-out source tree for secrets
        run: |
          docker run --rm --workdir /repo \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir . --config /repo/.gitleaks.toml --redact=100 --no-banner

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public source boundary
        run: |
          python3 scripts/robinswood_public_source_boundary.py
          python3 -m unittest scripts/tests/test_robinswood_public_source_boundary.py

      - name: Run Robinswood checks
        run: python3 scripts/robinswood_validate.py

      - name: Typecheck shared package
        run: bun run typecheck:shared

      - name: Typecheck server-core package
        run: cd packages/server-core && bun run tsc --noEmit

      - name: Typecheck Electron app
        run: bun run typecheck:electron

      - name: Verify provider catalogs and request capabilities
        env:
          CRAFT_CONFIG_DIR: ${{ runner.temp }}/robb-agents-provider-contracts
        run: |
          bun test packages/shared/tests/models.test.ts packages/shared/tests/models-pi.test.ts packages/shared/tests/llm-connections.test.ts packages/shared/src/config/__tests__/model-supports-images.test.ts
          bun test packages/shared/src/__tests__/interceptor-request-utils.test.ts packages/shared/src/__tests__/mistral-request-normalization.test.ts packages/shared/src/agent/__tests__/claude-thinking-config.test.ts packages/shared/src/agent/__tests__/pi-agent-vibe-steering.test.ts packages/shared/src/agent/__tests__/pi-agent-bridge-images.test.ts
          bun test packages/pi-agent-server/src/catalog-model-registration.test.ts packages/pi-agent-server/src/antigravity-server.test.ts packages/pi-agent-server/src/vibe-acp-server.test.ts packages/pi-agent-server/src/mistral-provider-contract.test.ts

      - name: Run focused fork tests
        run: |
          bun test \
            packages/shared/src/sources/__tests__/source-config-validation.test.ts \
            packages/shared/src/utils/__tests__/paths.test.ts \
            packages/shared/src/tasks/schema.test.ts \
            packages/shared/src/projects/__tests__/storage.test.ts \
            packages/shared/src/labels/__tests__/filter.test.ts \
            apps/electron/src/shared/__tests__/ipc-channels.test.ts \
            apps/electron/src/shared/__tests__/route-parser-label-filter.test.ts \
            apps/electron/src/main/handlers/__tests__/registration.test.ts \
            apps/electron/src/main/__tests__/robinswood-branding.test.ts \
            apps/electron/src/renderer/event-processor/handlers/__tests__/text-message-id-sync.test.ts \
            apps/electron/src/renderer/components/app-shell/input/__tests__/picker-mode.test.ts \
            apps/electron/src/renderer/components/app-shell/kanban/__tests__/node-state-pill.test.ts \
            apps/electron/src/renderer/components/app-shell/kanban/__tests__/subtask-merge.test.ts \
            apps/electron/src/renderer/components/app-shell/kanban/__tests__/task-spec-form.test.ts \
            apps/electron/src/renderer/config/__tests__/session-status-config.test.ts \
            apps/electron/src/renderer/hooks/__tests__/useOnboarding.test.ts \
            apps/electron/src/renderer/hooks/__tests__/useSessionSearch.test.ts \
            apps/electron/src/main/__tests__/connection-setup-logic.test.ts \
            packages/pi-agent-server/src/google-code-assist-provider.test.ts \
            packages/pi-agent-server/src/query-model.test.ts \
            packages/pi-agent-server/src/compact-selected-model.test.ts \
            packages/pi-agent-server/src/selected-thinking-level.test.ts \
            packages/server-core/src/tasks/task-node-execution.test.ts \
            packages/server-core/src/missions/MissionPlanner.test.ts \
            packages/server-core/src/missions/SessionMissionExecutor.test.ts \
            packages/server-core/src/missions/MissionDigitalTwinIntegration.test.ts \
            packages/shared/src/audit/routing-audit.test.ts \
            packages/server-core/src/tasks/TaskRunner.test.ts \
            packages/server-core/src/sessions/background-task-surface.test.ts \
            packages/server-core/src/sessions/workflow-task-progress.test.ts \
            packages/server-core/src/sessions/adopt-task-draft.test.ts \
            packages/server-core/src/sessions/session-created-notify.test.ts \
            packages/server-core/src/sessions/execute-prompt-automation-test-mode.test.ts \
            packages/session-tools-core/src/handlers/list-background-tasks.test.ts \
            packages/session-tools-core/src/handlers/send-agent-message.test.ts \
            packages/session-tools-core/src/handlers/set-session-status.test.ts \
            packages/server-core/src/sessions/runtime-config.test.ts

      - name: Run config-dir-sensitive runtime refresh test
        run: bun test packages/server-core/src/sessions/refresh-connection-runtime.test.ts
        env:
          CRAFT_CONFIG_DIR: ${{ runner.temp }}/robb-agents-refresh-runtime

  release-contract:
    name: Release contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate manifests and publication bundle
        run: |
          bun run typecheck:release-contract
          bun run test:release-contract
          bun test packages/session-tools-core/src/runtime/application-protection.test.ts packages/shared/src/agent/__tests__/claude-process.test.ts packages/shared/src/agent/core/__tests__/tool-effect-permissions.test.ts packages/shared/src/agent/core/__tests__/tool-effect-permissions-admits-the-bounded-pns-reads-from-the-current-structured-instruct.test.ts packages/shared/tests/mode-manager-bash-plan-paths.test.ts packages/shared/tests/mode-manager-powershell.test.ts

      - name: Validate installer contracts
        run: python3 scripts/tests/test_installers.py

      - name: Parse Unix installer
        if: runner.os != 'Windows'
        run: bash -n scripts/install-app.sh

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install-app.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell installer contains $($errors.Count) parse error(s)."
          }

  windows-installer:
    name: Windows installer validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'

      - name: Build and validate unsigned NSIS installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File apps/electron/scripts/build-win.ps1

      - name: Exercise isolated install and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/electron/release -Filter 'Robb-Agents-x64*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          powershell -ExecutionPolicy Bypass -File scripts/robinswood-windows-installer-e2e.ps1 -Installer $installer.FullName

  optional-upstream-validation:
    name: Optional upstream validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run upstream i18n checks
        run: |
          bun run lint:i18n:parity
          bun run lint:i18n:sorted

  scotland-conference:
    name: Scottish conference contract and Gmail effect guards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install existing HTTP helper dependency for offline tests
        run: python3 -m pip install 'requests>=2.31,<3'
      - name: Test bounded campaign without external effects
        run: |
          python3 ops/rbw-agents-oss/scripts/scotland_executive_conference_october_tests.py
          python3 ops/rbw-agents-oss/scripts/scotland_gateway_read_retry_tests.py
          python3 ops/rbw-agents-oss/scripts/scotland_daily40_tests.py
          python3 ops/rbw-agents-oss/scripts/robinswood_evergreen_france_tests.py
