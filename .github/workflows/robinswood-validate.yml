name: Robinswood Validate

on:
  pull_request:
    branches:
      - robinswood/main
  push:
    branches:
      - robinswood/main
  workflow_dispatch:

concurrency:
  group: robinswood-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Lightweight fork validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Robinswood checks
        run: python3 scripts/robinswood-validate.py

  optional-upstream-validation:
    name: Optional upstream validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run upstream i18n checks
        run: |
          bun run lint:i18n:parity
          bun run lint:i18n:sorted
