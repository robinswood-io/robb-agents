name: Build desktop release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_mode:
        description: "test-artifacts: unsigned; stage-signed: signed macOS QA only; publish-signed: public release"
        required: true
        default: test-artifacts
        type: choice
        options: [test-artifacts, stage-signed, publish-signed]
      tag:
        description: "Existing vX.Y.Z tag; required for publish modes"
        required: false
        type: string
permissions:
  contents: write
  attestations: write
  id-token: write
concurrency:
  group: robb-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    timeout-minutes: 10
    name: Release policy preflight
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      tag: ${{ steps.policy.outputs.tag }}
      version: ${{ steps.policy.outputs.version }}
      source_commit: ${{ steps.policy.outputs.source_commit }}
      release_mode: ${{ steps.policy.outputs.release_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.14.6"}
      - id: policy
        name: Validate tag, version and signing material
        env:
          REQUESTED_MODE: ${{ inputs.release_mode || '' }}
          REQUESTED_TAG: ${{ inputs.tag || '' }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'unsigned' }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_AZURE_ENDPOINT: ${{ vars.WINDOWS_AZURE_ENDPOINT }}
          WINDOWS_AZURE_ACCOUNT_NAME: ${{ vars.WINDOWS_AZURE_ACCOUNT_NAME }}
          WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_AZURE_PUBLISHER_NAME: ${{ vars.WINDOWS_AZURE_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/robinswood-prepare-release-source.sh
  quality:
    name: Release source quality gate
    permissions: {contents: read}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {NODE_OPTIONS: "--max-old-space-size=8192", ROBB_RULEBOOK_COMMIT: "109991b8a6b3967bab6c7860af4f5c0cafdff404", ROBB_EXPECTED_SOURCE_COMMIT: "${{ needs.preflight.outputs.source_commit }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.preflight.outputs.source_commit }}", persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.14.6"}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: {bun-version: "1.4.4"}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {version: "0.13.6"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "26.12.1"}
      - name: Install immutable workspace dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify public source boundary
        run: |
          python3 scripts/robinswood-public-source-boundary.py
          python3 -m unittest scripts/tests/test_robinswood_public_source_boundary.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: Aoleon/rulebook-ai, ref: "${{ env.ROBB_RULEBOOK_COMMIT }}", path: .quality-rulebook, ssh-key: "${{ secrets.ROBB_RULEBOOK_READONLY_SSH_KEY }}", persist-credentials: false}
      - name: Prepare headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2t64 libxss1 libgbm1
      - name: Diagnose restart recovery on Linux
        run: xvfb-run -a bash -o pipefail -c 'find packages/server-core -name node_modules -prune -o -name "*.test.ts" ! -name "*.e2e.test.ts" ! -path "*/refresh-connection-runtime.test.ts" -print | sort | xargs bun test --timeout 10000'
      - name: Validate source, installers and canonical quality
        run: xvfb-run -a python3 scripts/robinswood_quality_ci.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: release-quality-diagnostics, path: "${{ runner.temp }}/robb-public-quality/", if-no-files-found: ignore}
  macos:
    timeout-minutes: 90
    name: macOS ${{ matrix.arch }}
    needs: [preflight, quality]
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.14.6"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "26.12.1"}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: {bun-version: "1.4.4"}
      - name: Exercise macOS installer update contract
        run: python3 scripts/tests/test_installers.py
      - name: Build and validate macOS artifact
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GITHUB_TOKEN: ${{ github.token }}
          ROBB_BUILD_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          ROBB_BUILD_DIRTY: "false"
          ROBB_PACKAGE_LAUNCH_SMOKE: "1"
        run: |
          args=("${{ matrix.arch }}")
          if [[ "${{ needs.preflight.outputs.release_mode }}" != "test-artifacts" ]]; then
            if [[ -n "${APPLE_API_KEY_BASE64:-}" ]]; then
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["APPLE_API_KEY"]).write_bytes(
              base64.b64decode(os.environ["APPLE_API_KEY_BASE64"], validate=True)
          )
          PY
              chmod 600 "$APPLE_API_KEY"
              trap 'rm -f "$APPLE_API_KEY"' EXIT
            fi
            args+=(--release)
            bash apps/electron/scripts/build-dmg.sh "${args[@]}"
          else
            # Empty CI secret variables can be misread by electron-builder as
            # signing paths. Explicitly remove them for an unsigned test build.
            env -u CSC_LINK -u CSC_KEY_PASSWORD -u APPLE_ID -u APPLE_APP_SPECIFIC_PASSWORD -u APPLE_TEAM_ID -u APPLE_API_KEY -u APPLE_API_KEY_BASE64 -u APPLE_API_KEY_ID -u APPLE_API_ISSUER \
              bash apps/electron/scripts/build-dmg.sh "${args[@]}"
          fi
          cat > "apps/electron/release/PROVENANCE-macos-${{ matrix.arch }}.txt" <<EOF
          product=Robb Agents
          version=${{ needs.preflight.outputs.version }}
          source_commit=${{ needs.preflight.outputs.source_commit }}
          release_tag=${{ needs.preflight.outputs.tag }}
          platform=macos-${{ matrix.arch }}
          signing=$([[ "${{ needs.preflight.outputs.release_mode }}" != "test-artifacts" ]] && echo verified-developer-id-and-notarized || echo unsigned-test-artifact)
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          retention-days: 14
          path: |
            apps/electron/release/Robb-Agents-${{ matrix.arch }}.dmg
            apps/electron/release/Robb-Agents-${{ matrix.arch }}.zip
            apps/electron/release/SHA256SUMS-macos-${{ matrix.arch }}.txt
            apps/electron/release/PROVENANCE-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
  windows:
    if: needs.preflight.outputs.release_mode != 'stage-signed'
    timeout-minutes: 60
    name: Windows x64
    needs: [preflight, quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "26.12.1"}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: {bun-version: "1.4.4"}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.14.6"}
      - name: Exercise Windows installer update contract
        run: python3 scripts/tests/test_installers.py
      - name: Build and validate Windows installer
        env:
          WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'unsigned' }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_AZURE_ENDPOINT: ${{ vars.WINDOWS_AZURE_ENDPOINT }}
          WINDOWS_AZURE_ACCOUNT_NAME: ${{ vars.WINDOWS_AZURE_ACCOUNT_NAME }}
          WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_AZURE_PUBLISHER_NAME: ${{ vars.WINDOWS_AZURE_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          ROBB_BUILD_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          ROBB_BUILD_DIRTY: "false"
        shell: pwsh
        run: |
          $args = @('-ExecutionPolicy', 'Bypass', '-File', 'apps/electron/scripts/build-win.ps1')
          if ('${{ needs.preflight.outputs.publish }}' -eq 'true') {
            $env:ROBB_BUILD_CHANNEL = 'production'
            $args += '-Release'
          } else {
            $env:ROBB_BUILD_CHANNEL = 'development'
            # Avoid treating an empty Actions secret as a certificate location.
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          & powershell @args
          if ($LASTEXITCODE -ne 0) { throw 'Windows build wrapper failed' }
          $installer = Get-ChildItem apps/electron/release -Filter 'Robb-Agents-x64*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if ('${{ needs.preflight.outputs.publish }}' -eq 'true') {
            if ($env:WINDOWS_SIGNING_MODE -eq 'unsigned') {
              $signing = 'unsigned-public-release'
            } else {
              function Assert-ValidAuthenticodeSignature([string]$path, [string]$description) {
                if (-not (Test-Path $path -PathType Leaf)) { throw "Missing $description for Authenticode verification: $path" }
                $signature = Get-AuthenticodeSignature $path
                if ($signature.Status -ne 'Valid') {
                  throw "Authenticode verification failed for public release ${description}: $($signature.Status) $($signature.StatusMessage)"
                }
              }
              $unpackedBinary = 'apps/electron/release/win-unpacked/Robb Agents.exe'
              Assert-ValidAuthenticodeSignature $installer.FullName 'installer'
              Assert-ValidAuthenticodeSignature $unpackedBinary 'unpacked executable'
              $signing = 'verified-authenticode'
            }
          } else { $signing = 'unsigned-test-artifact' }
          @(
            'product=Robb Agents',
            'version=${{ needs.preflight.outputs.version }}',
            'source_commit=${{ needs.preflight.outputs.source_commit }}',
            'release_tag=${{ needs.preflight.outputs.tag }}',
            'platform=windows-x64',
            "signing=$signing"
          ) | Set-Content apps/electron/release/PROVENANCE-windows-x64.txt
      - name: Exercise isolated installer journey
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/electron/release -Filter 'Robb-Agents-x64*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          $e2eArgs = @('-ExecutionPolicy', 'Bypass', '-File', 'scripts/robinswood-windows-installer-e2e.ps1', '-Installer', $installer.FullName)
          if ('${{ needs.preflight.outputs.publish }}' -eq 'true' -and '${{ vars.WINDOWS_SIGNING_MODE || 'unsigned' }}' -ne 'unsigned') { $e2eArgs += '-RequireAuthenticode' }
          & powershell @e2eArgs
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Windows installer journey failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          retention-days: 14
          path: |
            apps/electron/release/Robb-Agents-x64*.exe
            apps/electron/release/SHA256SUMS-windows-x64.txt
            apps/electron/release/PROVENANCE-windows-x64.txt
          if-no-files-found: error
  linux:
    if: needs.preflight.outputs.release_mode != 'stage-signed'
    timeout-minutes: 45
    name: Linux x64
    needs: [preflight, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.14.6"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "26.12.1"}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: {bun-version: "1.4.4"}
      - name: Exercise Linux installer update contract
        run: python3 scripts/tests/test_installers.py
      - name: Install Linux desktop smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2t64 libxss1 libgbm1
      - name: Build and validate Linux AppImage
        env:
          # Public Linux artifacts are checksum/provenance verified. They do
          # not claim macOS/Windows code-signing status.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ROBB_BUILD_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          ROBB_BUILD_DIRTY: "false"
          ROBB_PACKAGE_LAUNCH_SMOKE: "1"
        run: |
          if [[ "${{ needs.preflight.outputs.publish }}" == "true" ]]; then
            export ROBB_BUILD_CHANNEL=production
            bash apps/electron/scripts/build-linux.sh x64 --release
          else
            export ROBB_BUILD_CHANNEL=development
            bash apps/electron/scripts/build-linux.sh x64
          fi
          cat > apps/electron/release/PROVENANCE-linux-x64.txt <<EOF
          product=Robb Agents
          version=${{ needs.preflight.outputs.version }}
          source_commit=${{ needs.preflight.outputs.source_commit }}
          release_tag=${{ needs.preflight.outputs.tag }}
          platform=linux-x64
          signing=checksum-and-provenance-verified
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          retention-days: 14
          path: |
            apps/electron/release/Robb-Agents-x64.AppImage
            apps/electron/release/SHA256SUMS-linux-x64.txt
            apps/electron/release/PROVENANCE-linux-x64.txt
          if-no-files-found: error
  publish:
    timeout-minutes: 20
    name: Publish GitHub Release
    if: needs.preflight.outputs.publish == 'true'
    needs: [preflight, macos, windows, linux]
    runs-on: ubuntu-latest
    # This environment is intentionally the single publication boundary. Configure
    # required reviewers once the repository is public or on a GitHub plan that
    # supports protected private environments.
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: {bun-version: "1.4.4"}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Revalidate immutable release source
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 '${{ needs.preflight.outputs.tag }}')"
          [[ "$checked_out_commit" == '${{ needs.preflight.outputs.source_commit }}' ]] || {
            echo "::error::Publish checkout $checked_out_commit differs from preflight source ${{ needs.preflight.outputs.source_commit }}"
            exit 1
          }
          [[ "$tag_commit" == '${{ needs.preflight.outputs.source_commit }}' ]] || {
            echo "::error::Release tag moved after preflight: $tag_commit"
            exit 1
          }
      - name: Consolidate release evidence
        run: |
          set -euo pipefail
          install -m 0755 scripts/install-app.sh release-assets/install-app.sh
          install -m 0644 scripts/install-app.ps1 release-assets/install-app.ps1
          {
            echo '## Verified release evidence'
            echo
            echo 'Every artifact was produced from the commit and tag listed below, checksum-verified, and signed as stated.'
            echo
            echo '```text'
            cat release-assets/PROVENANCE-*.txt
            echo '```'
            echo
            echo '## Verification'
            echo 'Verify downloaded artifacts against SHA256SUMS.txt before installation.'
          } > release-assets/RELEASE-STATUS.md
      - name: Generate stable GitHub updater manifests
        run: |
          bun run scripts/generate-github-update-manifests.ts \
            --release-dir release-assets \
            --version "${{ needs.preflight.outputs.version }}"
      - name: Generate release SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/SBOM.spdx.json
          artifact-name: robb-agents-${{ needs.preflight.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate the complete publication bundle
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )
          bun run scripts/validate-release-bundle.ts \
            --release-dir release-assets \
            --version "${{ needs.preflight.outputs.version }}" \
            --source-commit "${{ needs.preflight.outputs.source_commit }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --require-signed \
            --windows-signing-mode "${{ vars.WINDOWS_SIGNING_MODE || 'unsigned' }}" \
            --require-sbom
      # GitHub Free publishes attestations only for public repositories. The
      # release validator remains fail-closed for every platform; attestations
      # become mandatory evidence as
      # soon as the intended public OSS visibility is enabled.
      - name: Attest public release artifacts
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          subject-checksums: release-assets/SHA256SUMS.txt
      - name: Upload verified GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.preflight.outputs.tag }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "Robb Agents ${{ needs.preflight.outputs.version }}" \
            --notes-file release-assets/RELEASE-STATUS.md \
            --verify-tag \
            --draft
      - name: Verify the uploaded updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published_assets="$RUNNER_TEMP/published-release-assets.json"
          gh release view "${{ needs.preflight.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json assets > "$published_assets"
          bun run scripts/verify-github-release-assets.ts \
            --release-dir release-assets \
            --assets-json "$published_assets"
          published_feed="$RUNNER_TEMP/published-updater-feed"
          verified=false
          for attempt in 1 2 3 4 5 6; do
            rm -rf "$published_feed"
            mkdir -p "$published_feed"
            if gh release download "${{ needs.preflight.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --dir "$published_feed" \
              --pattern 'latest*.yml' \
              && cmp release-assets/latest.yml "$published_feed/latest.yml" \
              && cmp release-assets/latest-mac.yml "$published_feed/latest-mac.yml" \
              && cmp release-assets/latest-linux.yml "$published_feed/latest-linux.yml"; then
              verified=true
              break
            fi
            echo "Published updater feed not ready yet (attempt $attempt/6)"
            sleep 5
          done
          [[ "$verified" == true ]] || { echo "::error::Published updater manifests do not match the validated release bundle"; exit 1; }
      - name: Publish immutable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.preflight.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
      - name: Verify GitHub latest endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
            if [[ "$latest_tag" == "${{ needs.preflight.outputs.tag }}" ]]; then
              exit 0
            fi
            echo "GitHub latest is $latest_tag, waiting for ${{ needs.preflight.outputs.tag }} (attempt $attempt/6)"
            sleep 5
          done
          echo "::error::GitHub latest endpoint did not resolve to ${{ needs.preflight.outputs.tag }}"
          exit 1
      - name: Remove failed draft release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft="$(gh release view "${{ needs.preflight.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$is_draft" == true ]]; then
            gh release delete "${{ needs.preflight.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --yes
          fi
