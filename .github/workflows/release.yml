name: Publish desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example v0.11.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: robb-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Build signed release when Apple credentials are configured
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          args=("${{ matrix.arch }}")
          if [[ -n "$CSC_LINK" && -n "$APPLE_TEAM_ID" && ( -n "$APPLE_ID" || -n "$APPLE_API_KEY" ) ]]; then
            args+=(--release)
          else
            echo "::warning::Publishing unsigned macOS artifacts: signing/notarization secrets are not fully configured."
          fi
          bash apps/electron/scripts/build-dmg.sh "${args[@]}"
          if [[ " ${args[*]} " == *" --release "* ]]; then
            echo "macOS ${{ matrix.arch }}: signed and notarization-verified" > apps/electron/release/SIGNING-STATUS-macos-${{ matrix.arch }}.txt
          else
            echo "macOS ${{ matrix.arch }}: UNSIGNED test artifact (do not distribute as a production installer)" > apps/electron/release/SIGNING-STATUS-macos-${{ matrix.arch }}.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            apps/electron/release/Robb-Agents-${{ matrix.arch }}.dmg
            apps/electron/release/Robb-Agents-${{ matrix.arch }}.zip
            apps/electron/release/SHA256SUMS-macos-${{ matrix.arch }}.txt
            apps/electron/release/SIGNING-STATUS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Build NSIS installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $args = @('-ExecutionPolicy', 'Bypass', '-File', 'apps/electron/scripts/build-win.ps1')
          if ($env:CSC_LINK) { $args += '-Release' } else { Write-Warning 'Publishing unsigned Windows artifact: Authenticode secrets are not configured.' }
          & powershell @args
          if ($env:CSC_LINK) {
            'Windows x64: Authenticode signing requested' | Set-Content apps/electron/release/SIGNING-STATUS-windows-x64.txt
          } else {
            'Windows x64: UNSIGNED test artifact (do not distribute as a production installer)' | Set-Content apps/electron/release/SIGNING-STATUS-windows-x64.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            apps/electron/release/Robb-Agents-x64*.exe
            apps/electron/release/SHA256SUMS-windows-x64.txt
            apps/electron/release/SIGNING-STATUS-windows-x64.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Consolidate SHA-256 checksums
        run: |
          cat release-assets/SHA256SUMS-*.txt > release-assets/SHA256SUMS.txt
          {
            echo '## Artifact signing status'
            cat release-assets/SIGNING-STATUS-*.txt
            echo
            echo '## Verification'
            echo 'Verify downloaded artifacts against SHA256SUMS.txt before installation.'
          } > release-assets/RELEASE-STATUS.md
          cat release-assets/SHA256SUMS.txt
          cat release-assets/RELEASE-STATUS.md
      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          gh release create "$tag" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "Robb Agents ${tag#v}" \
            --notes-file release-assets/RELEASE-STATUS.md \
            --generate-notes
