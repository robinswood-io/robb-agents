name: Build desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_mode:
        description: "test-artifacts uploads CI artifacts only; publish-unsigned creates a public GitHub Release with an explicitly unsigned Windows installer; publish-signed requires Authenticode"
        required: true
        default: test-artifacts
        type: choice
        options: [test-artifacts, publish-unsigned, publish-signed]
      tag:
        description: "Existing vX.Y.Z tag; required for publish modes"
        required: false
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: robb-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release policy preflight
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      tag: ${{ steps.policy.outputs.tag }}
      version: ${{ steps.policy.outputs.version }}
      source_commit: ${{ steps.policy.outputs.source_commit }}
      release_mode: ${{ steps.policy.outputs.release_mode }}
      windows_require_authenticode: ${{ steps.policy.outputs.windows_require_authenticode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: policy
        name: Validate tag, version and signing material
        env:
          REQUESTED_MODE: ${{ inputs.release_mode || '' }}
          REQUESTED_TAG: ${{ inputs.tag || '' }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'pfx' }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_AZURE_ENDPOINT: ${{ vars.WINDOWS_AZURE_ENDPOINT }}
          WINDOWS_AZURE_ACCOUNT_NAME: ${{ vars.WINDOWS_AZURE_ACCOUNT_NAME }}
          WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_AZURE_PUBLISHER_NAME: ${{ vars.WINDOWS_AZURE_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/electron/package.json').version")"
          root_version="$(node -p "require('./package.json').version")"
          [[ "$version" == "$root_version" ]] || { echo "::error::Electron version $version must match root version $root_version"; exit 1; }
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          mode="${REQUESTED_MODE:-test-artifacts}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then mode="${REQUESTED_MODE:-publish-unsigned}"; fi
          if [[ "$mode" != "test-artifacts" && "$mode" != "publish-unsigned" && "$mode" != "publish-signed" ]]; then
            echo "::error::Unknown release mode: $mode"; exit 1
          fi

          publish=false
          windows_require_authenticode=false
          if [[ "$mode" == "publish-signed" ]]; then
            windows_require_authenticode=true
          fi

          if [[ "$mode" == publish-* ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Only stable X.Y.Z versions can be published: $version"; exit 1; }
            [[ "$tag" == "v${version}" ]] || { echo "::error::Tag $tag must match Electron version v${version}"; exit 1; }
            tag_commit="$(git rev-list -n 1 "$tag")"
            checked_out_commit="$(git rev-parse HEAD)"
            [[ -n "$tag_commit" && "$tag_commit" == "$checked_out_commit" ]] || {
              echo "::error::Checked-out source $checked_out_commit does not match immutable tag $tag ($tag_commit)"
              exit 1
            }
            preflight_args=(--ci --strict)
            if [[ "$windows_require_authenticode" != "true" ]]; then
              preflight_args+=(--allow-unsigned-windows)
            fi
            python3 scripts/robinswood-signing-preflight.py "${preflight_args[@]}"

            if [[ "$windows_require_authenticode" == "true" ]]; then
              if [[ "${WINDOWS_SIGNING_MODE}" == "pfx" ]]; then
                [[ -n "${WINDOWS_CSC_LINK:-}" && -n "${WINDOWS_CSC_KEY_PASSWORD:-}" ]] || {
                  echo "::error::publish-signed requires WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD when WINDOWS_SIGNING_MODE=pfx"
                  exit 1
                }
              elif [[ "${WINDOWS_SIGNING_MODE}" == "azure" ]]; then
                missing=()
                for name in WINDOWS_AZURE_ENDPOINT WINDOWS_AZURE_ACCOUNT_NAME WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME WINDOWS_AZURE_PUBLISHER_NAME AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
                  [[ -n "${!name:-}" ]] || missing+=("$name")
                done
                ((${#missing[@]} == 0)) || { printf "::error::publish-signed Azure signing is missing: %s\n" "${missing[*]}"; exit 1; }
              else
                echo "::error::Unsupported WINDOWS_SIGNING_MODE: ${WINDOWS_SIGNING_MODE}"; exit 1
              fi
            else
              echo "::notice::publish-unsigned/test mode will build Windows without Authenticode; release notes and provenance will state this explicitly."
            fi

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::GitHub Release $tag already exists; refusing to overwrite it"; exit 1
            fi
            publish=true
          else
            tag="test-${GITHUB_SHA::12}"
            echo "::notice::Test artifacts will be retained in CI only; no GitHub Release will be created."
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "windows_require_authenticode=$windows_require_authenticode" >> "$GITHUB_OUTPUT"

  quality:
    name: Release source quality gate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: astral-sh/setup-uv@v5
      - name: Install immutable workspace dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate source, updater and installer contracts
        run: bun run validate:ci

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [preflight, quality]
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.tag || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Exercise macOS installer update contract
        run: python3 scripts/tests/test_installers.py
      - name: Build and validate macOS artifact
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GITHUB_TOKEN: ${{ github.token }}
          ROBB_PACKAGE_LAUNCH_SMOKE: "1"
        run: |
          args=("${{ matrix.arch }}")
          if [[ "${{ needs.preflight.outputs.publish }}" == "true" ]]; then
            if [[ -n "${APPLE_API_KEY_BASE64:-}" ]]; then
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["APPLE_API_KEY"]).write_bytes(
              base64.b64decode(os.environ["APPLE_API_KEY_BASE64"], validate=True)
          )
          PY
              chmod 600 "$APPLE_API_KEY"
              trap 'rm -f "$APPLE_API_KEY"' EXIT
            fi
            args+=(--release)
            bash apps/electron/scripts/build-dmg.sh "${args[@]}"
          else
            # Empty CI secret variables can be misread by electron-builder as
            # signing paths. Explicitly remove them for an unsigned test build.
            env -u CSC_LINK -u CSC_KEY_PASSWORD -u APPLE_ID -u APPLE_APP_SPECIFIC_PASSWORD -u APPLE_TEAM_ID -u APPLE_API_KEY -u APPLE_API_KEY_BASE64 -u APPLE_API_KEY_ID -u APPLE_API_ISSUER \
              bash apps/electron/scripts/build-dmg.sh "${args[@]}"
          fi
          cat > "apps/electron/release/PROVENANCE-macos-${{ matrix.arch }}.txt" <<EOF
          product=Robb Agents
          version=${{ needs.preflight.outputs.version }}
          source_commit=${{ needs.preflight.outputs.source_commit }}
          release_tag=${{ needs.preflight.outputs.tag }}
          platform=macos-${{ matrix.arch }}
          signing=$([[ "${{ needs.preflight.outputs.publish }}" == "true" ]] && echo verified-developer-id-and-notarized || echo unsigned-test-artifact)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          retention-days: 14
          path: |
            apps/electron/release/Robb-Agents-${{ matrix.arch }}.dmg
            apps/electron/release/Robb-Agents-${{ matrix.arch }}.zip
            apps/electron/release/SHA256SUMS-macos-${{ matrix.arch }}.txt
            apps/electron/release/PROVENANCE-macos-${{ matrix.arch }}.txt
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [preflight, quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.tag || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exercise Windows installer update contract
        run: python3 scripts/tests/test_installers.py
      - name: Build and validate Windows installer
        env:
          WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'pfx' }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_AZURE_ENDPOINT: ${{ vars.WINDOWS_AZURE_ENDPOINT }}
          WINDOWS_AZURE_ACCOUNT_NAME: ${{ vars.WINDOWS_AZURE_ACCOUNT_NAME }}
          WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_AZURE_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_AZURE_PUBLISHER_NAME: ${{ vars.WINDOWS_AZURE_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $args = @('-ExecutionPolicy', 'Bypass', '-File', 'apps/electron/scripts/build-win.ps1')
          if ('${{ needs.preflight.outputs.windows_require_authenticode }}' -eq 'true') {
            $args += '-Release'
          } else {
            # Avoid treating an empty Actions secret as a certificate location.
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          & powershell @args
          $installer = Get-ChildItem apps/electron/release -Filter 'Robb-Agents-x64*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if ('${{ needs.preflight.outputs.windows_require_authenticode }}' -eq 'true') {
            if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw 'Authenticode verification failed for public release installer' }
            $signing = 'verified-authenticode'
          } elseif ('${{ needs.preflight.outputs.publish }}' -eq 'true') {
            $signing = 'unsigned-github-release'
          } else { $signing = 'unsigned-test-artifact' }
          @(
            'product=Robb Agents',
            'version=${{ needs.preflight.outputs.version }}',
            'source_commit=${{ needs.preflight.outputs.source_commit }}',
            'release_tag=${{ needs.preflight.outputs.tag }}',
            'platform=windows-x64',
            "signing=$signing"
          ) | Set-Content apps/electron/release/PROVENANCE-windows-x64.txt
      - name: Exercise isolated installer journey
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/electron/release -Filter 'Robb-Agents-x64*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          powershell -ExecutionPolicy Bypass -File scripts/robinswood-windows-installer-e2e.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          retention-days: 14
          path: |
            apps/electron/release/Robb-Agents-x64*.exe
            apps/electron/release/SHA256SUMS-windows-x64.txt
            apps/electron/release/PROVENANCE-windows-x64.txt
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [preflight, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.tag || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Exercise Linux installer update contract
        run: python3 scripts/tests/test_installers.py
      - name: Install Linux desktop smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2t64 libxss1 libgbm1
      - name: Build and validate Linux AppImage
        env:
          # Public Linux artifacts are checksum/provenance verified. They do
          # not claim macOS/Windows code-signing status.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ROBB_PACKAGE_LAUNCH_SMOKE: "1"
        run: |
          bash apps/electron/scripts/build-linux.sh x64
          cat > apps/electron/release/PROVENANCE-linux-x64.txt <<EOF
          product=Robb Agents
          version=${{ needs.preflight.outputs.version }}
          source_commit=${{ needs.preflight.outputs.source_commit }}
          release_tag=${{ needs.preflight.outputs.tag }}
          platform=linux-x64
          signing=checksum-and-provenance-verified
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          retention-days: 14
          path: |
            apps/electron/release/Robb-Agents-x64.AppImage
            apps/electron/release/SHA256SUMS-linux-x64.txt
            apps/electron/release/PROVENANCE-linux-x64.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: needs.preflight.outputs.publish == 'true'
    needs: [preflight, macos, windows, linux]
    runs-on: ubuntu-latest
    # This environment is intentionally the single publication boundary. Configure
    # required reviewers once the repository is public or on a GitHub plan that
    # supports protected private environments.
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Consolidate release evidence
        run: |
          set -euo pipefail
          install -m 0755 scripts/install-app.sh release-assets/install-app.sh
          install -m 0644 scripts/install-app.ps1 release-assets/install-app.ps1
          {
            echo '## Verified release evidence'
            echo
            echo 'Every artifact was produced from the commit and tag listed below, checksum-verified, and signed as stated.'
            echo
            if [[ '${{ needs.preflight.outputs.release_mode }}' == 'publish-unsigned' ]]; then
              echo '> **Windows notice:** the Windows `.exe` installer in this release is intentionally **not Authenticode-signed**. Windows may show an “Unknown publisher” or SmartScreen warning. Verify `SHA256SUMS.txt` and the GitHub provenance before installation.'
              echo
            fi
            echo '```text'
            cat release-assets/PROVENANCE-*.txt
            echo '```'
            echo
            echo '## Verification'
            echo 'Verify downloaded artifacts against SHA256SUMS.txt before installation.'
          } > release-assets/RELEASE-STATUS.md
      - name: Generate stable GitHub updater manifests
        run: |
          bun run scripts/generate-github-update-manifests.ts \
            --release-dir release-assets \
            --version "${{ needs.preflight.outputs.version }}"
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/SBOM.spdx.json
          artifact-name: robb-agents-${{ needs.preflight.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate the complete publication bundle
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )
          validate_args=(
            --release-dir release-assets
            --version "${{ needs.preflight.outputs.version }}"
            --source-commit "${{ needs.preflight.outputs.source_commit }}"
            --tag "${{ needs.preflight.outputs.tag }}"
            --require-signed
            --require-sbom
          )
          if [[ '${{ needs.preflight.outputs.release_mode }}' == 'publish-unsigned' ]]; then
            validate_args+=(--allow-unsigned-windows)
          fi
          bun run scripts/validate-release-bundle.ts "${validate_args[@]}"
      # GitHub Free publishes attestations only for public repositories. The
      # release validator remains fail-closed except for the explicit Windows
      # unsigned-github-release state; attestations become mandatory evidence as
      # soon as the intended public OSS visibility is enabled.
      - name: Attest public release artifacts
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: release-assets/SHA256SUMS.txt
      - name: Upload verified GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.preflight.outputs.tag }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "Robb Agents ${{ needs.preflight.outputs.version }}" \
            --notes-file release-assets/RELEASE-STATUS.md \
            --verify-tag \
            --draft
      - name: Verify the uploaded updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published_assets="$RUNNER_TEMP/published-release-assets.json"
          gh release view "${{ needs.preflight.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json assets > "$published_assets"
          bun run scripts/verify-github-release-assets.ts \
            --release-dir release-assets \
            --assets-json "$published_assets"

          published_feed="$RUNNER_TEMP/published-updater-feed"
          verified=false
          for attempt in 1 2 3 4 5 6; do
            rm -rf "$published_feed"
            mkdir -p "$published_feed"
            if gh release download "${{ needs.preflight.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --dir "$published_feed" \
              --pattern 'latest*.yml' \
              && cmp release-assets/latest.yml "$published_feed/latest.yml" \
              && cmp release-assets/latest-mac.yml "$published_feed/latest-mac.yml" \
              && cmp release-assets/latest-linux.yml "$published_feed/latest-linux.yml"; then
              verified=true
              break
            fi
            echo "Published updater feed not ready yet (attempt $attempt/6)"
            sleep 5
          done
          [[ "$verified" == true ]] || { echo "::error::Published updater manifests do not match the validated release bundle"; exit 1; }

      - name: Publish immutable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.preflight.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
      - name: Verify GitHub latest endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
            if [[ "$latest_tag" == "${{ needs.preflight.outputs.tag }}" ]]; then
              exit 0
            fi
            echo "GitHub latest is $latest_tag, waiting for ${{ needs.preflight.outputs.tag }} (attempt $attempt/6)"
            sleep 5
          done
          echo "::error::GitHub latest endpoint did not resolve to ${{ needs.preflight.outputs.tag }}"
          exit 1
      - name: Remove failed draft release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft="$(gh release view "${{ needs.preflight.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$is_draft" == true ]]; then
            gh release delete "${{ needs.preflight.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --yes
          fi
