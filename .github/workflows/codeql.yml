name: CodeQL

on:
  push:
    branches: [robinswood/main]
  pull_request:
    branches: [robinswood/main]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # GitHub Code Scanning is available for this project once the intended
    # public OSS visibility is enabled. Keeping the workflow present now makes
    # the transition explicit without pretending private-plan results exist.
    if: github.event.repository.private == false
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
