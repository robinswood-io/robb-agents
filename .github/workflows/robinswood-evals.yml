name: Robinswood continuous eval gate

on:
  pull_request:
    paths:
      - "evals/**"
      - "packages/shared/src/evals/**"
      - "packages/shared/src/sources/**"
      - ".github/workflows/robinswood-evals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run versioned eval gate contracts
        run: >-
          bun test
          packages/shared/src/evals/eval-gate.test.ts
          packages/shared/src/evals/provider-eval-runner.test.ts
          packages/shared/src/telemetry/execution-telemetry.test.ts
          packages/shared/src/telemetry/otlp-collector-smoke.test.ts
      - name: Validate OTLP export against a live collector
        run: bun run scripts/robb-otlp-collector-smoke.ts
